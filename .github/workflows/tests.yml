name: Python tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: "${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run analyzer, dashboard, and CLI regressions
        run: python -m unittest discover -s tests -v
      - name: Generate sample JSON and offline dashboard
        run: python -m riftguard.cli data/sample_events.json --output sample-report.json --dashboard reliability-dashboard.html
      - name: Validate JSON report
        run: python -m json.tool sample-report.json
      - name: Generate multi-version dashboard
        run: python -m riftguard.cli data/version_comparison_events.json --output version-report.json --dashboard version-dashboard.html
