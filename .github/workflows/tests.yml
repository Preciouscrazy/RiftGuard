name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Generate report and dashboard
        run: python -m riftguard.cli data/sample_events.json --output sample-report.json --dashboard reliability-dashboard.html
      - name: Validate generated outputs
        run: |
          python -m json.tool sample-report.json > /dev/null
          python -c "from pathlib import Path; h=Path('reliability-dashboard.html').read_text(); assert 'id=\"version\"' in h and 'id=\"timeline\"' in h and 'https://' not in h"
